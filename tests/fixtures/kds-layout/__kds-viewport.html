<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>UI TEST ONLY — KDS viewport harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9edf0;
        color: #202b33;
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      header {
        padding: 10px 14px;
        background: white;
        border-bottom: 1px solid #bbc7ce;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 4px 0;
      }
      #viewport-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 8px 0 4px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 600;
      }
      input {
        width: 82px;
        padding: 6px;
        border: 1px solid #98a5af;
        border-radius: 4px;
        font: inherit;
      }
      button {
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid #98a5af;
        border-radius: 4px;
        background: white;
        color: #202b33;
        font:
          600 13px/1.3 system-ui,
          sans-serif;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #253744;
        color: white;
      }
      #stage {
        position: relative;
        margin: 12px;
        min-width: 0;
      }
      #frame-space {
        position: relative;
        margin: 0 auto;
      }
      iframe {
        display: block;
        transform-origin: left top;
        border: 0;
        outline: 1px solid #51626d;
        background: #fff6e8;
      }
      #viewport-status {
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>UI TEST ONLY · KDS viewport harness</h1>
      <p>
        Resizing changes the same iframe’s viewport without reloading its React state. Large frames
        scale visually to fit the outer window.
      </p>
      <form id="viewport-controls">
        <label
          >Width
          <input
            id="viewport-width"
            aria-label="Viewport width"
            type="number"
            min="280"
            max="2560"
            value="390"
        /></label>
        <label
          >Height
          <input
            id="viewport-height"
            aria-label="Viewport height"
            type="number"
            min="320"
            max="1600"
            value="844"
        /></label>
        <button id="apply-viewport" type="submit">Apply size</button>
        <button type="button" data-width="320" data-height="720">320 mobile</button>
        <button type="button" data-width="390" data-height="844">390 mobile</button>
        <button type="button" data-width="768" data-height="1024">768 tablet</button>
        <button type="button" data-width="1280" data-height="900">1280 desktop</button>
        <button type="button" data-width="1600" data-height="1000">1600 desktop</button>
        <label
          ><input
            id="fit-frame"
            aria-label="Scale large frame to fit"
            type="checkbox"
            checked
            style="width: 18px"
          />Fit frame</label
        >
      </form>
      <output id="viewport-status" aria-live="polite"></output>
    </header>
    <div id="stage">
      <div id="frame-space">
        <iframe
          id="qa-frame"
          title="Synthetic MealDeck KDS UI fixture"
          src="/__kds-layout-qa.html"
          width="390"
          height="844"
        ></iframe>
      </div>
    </div>
    <script>
      const frame = document.getElementById("qa-frame");
      const stage = document.getElementById("stage");
      const space = document.getElementById("frame-space");
      const widthInput = document.getElementById("viewport-width");
      const heightInput = document.getElementById("viewport-height");
      const fitInput = document.getElementById("fit-frame");
      let frameWidth = 390;
      let frameHeight = 844;
      function paintViewport() {
        const scale = fitInput.checked ? Math.min(1, stage.clientWidth / frameWidth) : 1;
        frame.style.width = `${frameWidth}px`;
        frame.style.height = `${frameHeight}px`;
        frame.style.transform = `scale(${scale})`;
        space.style.width = `${Math.round(frameWidth * scale)}px`;
        space.style.height = `${Math.round(frameHeight * scale)}px`;
        document.getElementById("viewport-status").textContent =
          `Iframe viewport: ${frameWidth} × ${frameHeight} CSS px · visual scale: ${Math.round(scale * 100)}% · iframe not reloaded`;
        document
          .querySelectorAll("[data-width]")
          .forEach((button) =>
            button.setAttribute(
              "aria-pressed",
              String(Number(button.dataset.width) === frameWidth),
            ),
          );
      }
      function applySize(width, height) {
        frameWidth = Math.max(280, Math.min(2560, Number(width) || 390));
        frameHeight = Math.max(320, Math.min(1600, Number(height) || 844));
        widthInput.value = String(frameWidth);
        heightInput.value = String(frameHeight);
        paintViewport();
      }
      document.getElementById("viewport-controls").addEventListener("submit", (event) => {
        event.preventDefault();
        applySize(widthInput.value, heightInput.value);
      });
      document
        .querySelectorAll("[data-width]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            applySize(button.dataset.width, button.dataset.height),
          ),
        );
      fitInput.addEventListener("change", paintViewport);
      new ResizeObserver(paintViewport).observe(stage);
      paintViewport();
    </script>
  </body>
</html>
