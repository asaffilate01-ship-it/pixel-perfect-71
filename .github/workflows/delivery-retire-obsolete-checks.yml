name: Retire superseded delivery validation runs
on:
  pull_request:
    paths: ['.github/workflows/delivery-retire-obsolete-checks.yml']
permissions:
  actions: write
  contents: read
jobs:
  retire-old-checks:
    if: github.head_ref == 'feat/own-driver-luton-delivery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep latest runs and cancel obsolete validation only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const allowed = new Set([
            'Verify MealDeck', 'Verify KDS six-stage workflow',
            'Verify WhatsApp guest checkout', 'Verify prelaunch checkout access',
            'Validate own-driver delivery release', 'H10S live receipt APK',
            'Verify customer mobile notifications', 'Own-driver delivery PostgreSQL lifecycle'
          ]);
          const base = 'https://api.github.com/repos/' + process.env.REPOSITORY;
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const runs = [];
          for (let page = 1; page <= 6; page++) {
            const response = await fetch(base + '/actions/runs?branch=feat%2Fown-driver-luton-delivery&per_page=100&page=' + page, { headers });
            if (!response.ok) throw new Error('Unable to inspect validation queue: ' + response.status);
            const value = await response.json();
            runs.push(...value.workflow_runs);
            if (value.workflow_runs.length < 100) break;
          }
          runs.sort((a,b) => b.id-a.id);
          const newest = new Set();
          let cancelled = 0;
          for (const run of runs) {
            if (run.head_branch !== 'feat/own-driver-luton-delivery' || !allowed.has(run.name)) continue;
            const group = run.workflow_id + ':' + run.event;
            if (!newest.has(group)) { newest.add(group); continue; }
            if (!['queued','in_progress','waiting','pending'].includes(run.status) || String(run.id) === process.env.THIS_RUN) continue;
            const response = await fetch(base + '/actions/runs/' + run.id + '/cancel', { method: 'POST', headers });
            if (response.status === 202) { cancelled++; console.log('Retired superseded validation', run.id, run.name); }
            else if (![409,422].includes(response.status)) throw new Error('Validation cancellation refused: ' + response.status);
          }
          console.log('Retired ' + cancelled + ' obsolete validation runs. Latest runs, other branches and all publishing jobs were preserved.');
          NODE
