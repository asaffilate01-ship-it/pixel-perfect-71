name: Publish signed MealDeck H10S printer v0.2.3
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mealdeck-printer-signed-release
  cancel-in-progress: false

jobs:
  publish-printer-v023:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mealdeck-printer/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Require the original v0.2.2 private signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MEALDECK_PRINTER_ORIGINAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MEALDECK_PRINTER_ORIGINAL_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo 'Original printer signing identity not installed as protected repository secrets.'
            echo 'Do not create a new key, uninstall the existing app, or publish an incompatible APK.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mealdeck-printer-original-release.p12"
          # apksigner consumes password-file streams independently. The old
          # v0.2.2 publisher reused a single EOF-exhausted file for both
          # --ks-pass and --key-pass and failed at the key-password read.
          printf '%s\n' "$STORE_PASSWORD" > "$RUNNER_TEMP/mealdeck-printer-original-storepass.txt"
          printf '%s\n' "$STORE_PASSWORD" > "$RUNNER_TEMP/mealdeck-printer-original-keypass.txt"
          test -s "$RUNNER_TEMP/mealdeck-printer-original-release.p12"

      - name: Build and test printer v0.2.3 with the complete receipt renderer
        working-directory: apps/mealdeck-printer
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
          npm run typecheck
          npm run test:web
          npm run test:native-core
          node native/generate-receipt-fixtures.mjs --check
          node native/generate-receipt-games-qr.mjs --check
          npm run sync:android
          npm run verify:native
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          (cd android && ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace)

      - name: Sign v0.2.3 with original certificate and verify update compatibility
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          OLD="public/downloads/mealdeck-printer-h10s-0.2.2.apk"
          ALIGNED="$RUNNER_TEMP/mealdeck-printer-0.2.3-aligned.apk"
          OUTPUT="public/downloads/mealdeck-printer-h10s-0.2.3.apk"
          APK="apps/mealdeck-printer/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$OLD" && test -s "$APK"
          "$TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$TOOLS/zipalign" -c -p 4 "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/mealdeck-printer-original-release.p12" \
            --ks-key-alias mealdeck-printer-release \
            --ks-pass "file:$RUNNER_TEMP/mealdeck-printer-original-storepass.txt" \
            --key-pass "file:$RUNNER_TEMP/mealdeck-printer-original-keypass.txt" \
            --out "$OUTPUT" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$OLD" > "$RUNNER_TEMP/printer-v022-cert.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT" > "$RUNNER_TEMP/printer-v023-cert.txt"
          old_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/printer-v022-cert.txt" | head -1)"
          new_signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/printer-v023-cert.txt" | head -1)"
          test -n "$old_signer" && test -n "$new_signer"
          if [ "$old_signer" != "$new_signer" ]; then
            echo 'BLOCKED: APK signature differs from published v0.2.2. Existing H10S app cannot be updated safely.'
            rm -f "$OUTPUT"
            exit 1
          fi
          # The public owner certificate is an independent signer continuity guard.
          expected="$(openssl x509 -in apps/mealdeck-printer/release-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d : | tr A-F a-f)"
          if [ "$expected" != "$old_signer" ]; then
            echo 'BLOCKED: published v0.2.2 does not match the recorded release certificate.'
            rm -f "$OUTPUT"
            exit 1
          fi
          "$TOOLS/aapt" dump badging "$OUTPUT" > "$RUNNER_TEMP/printer-v023-badging.txt"
          grep -q "package: name='uk.co.mealdeck.printer' versionCode='5' versionName='0.2.3'" "$RUNNER_TEMP/printer-v023-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/printer-v023-badging.txt"; then
            echo 'BLOCKED: APK is debuggable.'
            rm -f "$OUTPUT"
            exit 1
          fi
          (cd public/downloads && sha256sum mealdeck-printer-h10s-0.2.3.apk > mealdeck-printer-h10s-0.2.3.apk.sha256)
          echo 'Original and update signatures match. Release is aligned, signed, non-debuggable and checksummed.' >> "$GITHUB_STEP_SUMMARY"
          echo "Signer SHA-256: $new_signer" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only the approved signed APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MealDeck Printer Release Bot'
          git config user.email 'release-bot@mealdeck.co.uk'
          git add public/downloads/mealdeck-printer-h10s-0.2.3.apk public/downloads/mealdeck-printer-h10s-0.2.3.apk.sha256
          git commit -m 'release(printer): publish verified signed H10S v0.2.3 [skip ci]'
          git push origin HEAD:main
          echo 'Published signed, certificate-compatible v0.2.3. Keep the v0.2.2 app installed and update over it.' >> "$GITHUB_STEP_SUMMARY"
