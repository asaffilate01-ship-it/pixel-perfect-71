name: Publish verified KDS implementation
on:
  push:
    branches: [feature/mealdeck-six-stage-kds-20261106]
    paths: [.github/workflows/kds-stage-implementation.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'asaffilate01-ship-it/pixel-perfect-71'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply exact locally tested patch to unchanged baseline
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          expected = {
            '.github/workflows/verify.yml': '05350795e1ba7b7731dd364a17f62aad73e4bdd7',
            'src/components/ops/kds-panel.tsx': 'c41fe6f80ddfef30bbf7c61a44b0b9a14121675f',
            'src/lib/mealdeck-kds-presentation.ts': 'd7aeeef2fc7f45afbd8867f87ffb1c0ae52b6123',
            'src/lib/mealdeck-kds.ts': '7da39c72fefd2bcf6f07c770ceddf192778dfc41',
            'tests/mealdeck-kds-presentation.test.ts': '2d1a4907fcf586721bc6b61994a3d70412a21885',
            'tests/mealdeck-kds.test.ts': 'fbd7b50ce5725366346060ec95ddf30fc7b23bb9',
          }
          for path, sha in expected.items():
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha, path+' changed; stop rather than overwrite'
          payload = ''''''
          patch = gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e3ac28e20f2143d8e5f3d017d4420be984d71fa7832e1c8c1900e4d0c0d08661'
          subprocess.run(['git','apply','--check','--unidiff-zero','--index','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','rm','.github/workflows/kds-stage-preparation.yml','.github/workflows/kds-stage-implementation.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
      - name: Commit and push only this feature branch without force
        env:
          TARGET_BRANCH: feature/mealdeck-six-stage-kds-20261106
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'MealDeck Build'
          git config user.email 'build@mealdeck.invalid'
          git commit -m 'Implement six-stage KDS with verified, read-only completed history'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
