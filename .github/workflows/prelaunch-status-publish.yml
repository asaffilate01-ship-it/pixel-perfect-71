name: Publish prelaunch status fix
on:
  push:
    branches: [fix/mealdeck-prelaunch-tester-status-20261106]
    paths: [.github/workflows/prelaunch-status-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'asaffilate01-ship-it/pixel-perfect-71'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply the exact reviewed patch without changing workflows
        shell: python
        run: |
          import base64,gzip,hashlib,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(pathlib.Path('scripts/prelaunch-status.patch.gz.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='0495882cad311514da54b89ee0fc7d6fc737c12224b6b17961edcb838c07aeb7'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','--index','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','rm','scripts/prelaunch-status.patch.gz.b64'],check=True)
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix tests/postgres --ignore-scripts
      - name: Format changed source and check whitespace
        run: |
          git diff --cached --name-only --diff-filter=AM -z -- '*.ts' '*.tsx' '*.md' | xargs -0 bunx --no-install prettier --write
          git add src/components/group-order-room.tsx src/components/launch-checkout.tsx src/lib/mealdeck-checkout-browser.ts src/lib/mealdeck-group-rooms-browser.ts src/lib/mealdeck-group-rooms.server.ts src/lib/mealdeck-online-checkout.server.ts src/lib/mealdeck-payment-server-core.ts src/lib/mealdeck-shared-payments-browser.ts src/lib/mealdeck-shared-payments.server.ts tests/mealdeck-prelaunch-status.test.ts docs/mealdeck-prelaunch-status-fix-20261106.md
          git diff --cached --check
      - name: Verify test-only access, ordinary checkout and group payments
        run: bun test tests/mealdeck-prelaunch-status.test.ts tests/mealdeck-checkout-browser.test.ts tests/mealdeck-online-checkout.test.ts tests/mealdeck-guest-checkout.test.ts tests/mealdeck-shared-payments-server.test.ts tests/mealdeck-group-rooms.test.ts tests/mealdeck-payment-http-postgres.test.ts
      - name: Check implementation types, lint and production build
        run: |
          bunx --no-install tsc --noEmit
          bunx --no-install eslint src/components/group-order-room.tsx src/components/launch-checkout.tsx src/lib/mealdeck-checkout-browser.ts src/lib/mealdeck-group-rooms-browser.ts src/lib/mealdeck-group-rooms.server.ts src/lib/mealdeck-online-checkout.server.ts src/lib/mealdeck-payment-server-core.ts src/lib/mealdeck-shared-payments-browser.ts src/lib/mealdeck-shared-payments.server.ts tests/mealdeck-prelaunch-status.test.ts
          bun run build
      - name: Commit verified application files without force or workflow writes
        env:
          TARGET_BRANCH: fix/mealdeck-prelaunch-tester-status-20261106
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'MealDeck Build'
          git config user.email 'build@mealdeck.invalid'
          git commit -m 'Fix authenticated test-only checkout availability before public opening'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
  public-signal:
    name: Read public checkout state without credentials
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Read anonymous checkout status without exposing cookies
        shell: python
        run: |
          import json,urllib.request
          try:
            req=urllib.request.Request('https://mealdeck.co.uk/api/checkout',headers={'Accept':'application/json','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=20) as response:
              data=json.load(response)
              print(json.dumps({'http_status':response.status,'available':data.get('available'),'kitchen':data.get('kitchen'),'offer_status':data.get('openingOffer',{}).get('status')},sort_keys=True))
          except Exception as error:
            print('Public status read not verified: '+type(error).__name__)
