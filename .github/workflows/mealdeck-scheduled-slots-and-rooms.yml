name: MealDeck scheduled slots and group-room lifecycle

on:
  pull_request:
    paths:
      - 'src/lib/mealdeck-scheduled-orders.ts'
      - 'src/lib/mealdeck-group-rooms.ts'
      - 'src/lib/mealdeck-group-rooms.server.ts'
      - 'src/lib/mealdeck-kds.ts'
      - 'src/components/ops/kds-panel.tsx'
      - 'src/components/group-order-room.tsx'
      - 'src/components/group-room-setup.tsx'
      - 'tests/mealdeck-scheduled-orders.test.ts'
      - 'tests/mealdeck-group-rooms.test.ts'
      - 'tests/mealdeck-group-choice-ttl-sql.test.ts'
      - 'tests/postgres/ordering-rooms-behavior.mjs'
      - 'deploy/mealdeck/post-install-migrations/20261110113000_mealdeck_group_saved_choices_ttl.sql'
      - 'tests/mealdeck-kds.test.ts'
      - 'deploy/mealdeck/post-install-migrations/20261109194000_mealdeck_group_room_lifecycle.sql'
      - 'deploy/mealdeck/post-install-migrations/20261109194100_mealdeck_group_timeout_cron.sql'
      - '.github/workflows/mealdeck-scheduled-slots-and-rooms.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/mealdeck-scheduled-orders.ts'
      - 'src/lib/mealdeck-group-rooms.ts'
      - 'src/lib/mealdeck-group-rooms.server.ts'
      - 'src/lib/mealdeck-kds.ts'
      - 'src/components/ops/kds-panel.tsx'
      - 'src/components/group-order-room.tsx'
      - 'src/components/group-room-setup.tsx'
      - 'tests/mealdeck-scheduled-orders.test.ts'
      - 'tests/mealdeck-group-rooms.test.ts'
      - 'tests/mealdeck-group-choice-ttl-sql.test.ts'
      - 'tests/postgres/ordering-rooms-behavior.mjs'
      - 'deploy/mealdeck/post-install-migrations/20261110113000_mealdeck_group_saved_choices_ttl.sql'
      - 'tests/mealdeck-kds.test.ts'
      - '.github/workflows/mealdeck-scheduled-slots-and-rooms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-slots-and-rooms:
    name: UK slots, group lifecycle and kitchen types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked Bun runtime
        run: npm install --global bun@1.4.4 --no-audit --no-fund
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run policy and safety tests
        run: bun test tests/mealdeck-scheduled-orders.test.ts tests/mealdeck-group-rooms.test.ts tests/mealdeck-group-choice-ttl-sql.test.ts tests/mealdeck-kds.test.ts
      - name: Install isolated PostgreSQL test dependencies
        run: npm ci --prefix tests/postgres
      - name: Verify private group room expiry on disposable PGlite
        run: node tests/postgres/ordering-rooms-behavior.mjs
      - name: Type-check application and UI
        run: bunx tsc --noEmit

  group-choice-native-postgres17:
    name: Native PostgreSQL 17 — unpaid group choices and frozen payments
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mealdeck_disposable_ci_only
          POSTGRES_DB: mealdeck_group_choice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealdeck_group_choice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL test harness
        run: npm ci --prefix tests/postgres
      - name: Verify private choice TTL, participant isolation and frozen payments
        env:
          MEALDECK_KDS_TEST_DATABASE_URL: postgresql://postgres:mealdeck_disposable_ci_only@127.0.0.1:5432/mealdeck_group_choice_test
        run: node tests/postgres/ordering-rooms-behavior.mjs --native
