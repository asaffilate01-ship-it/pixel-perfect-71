name: Verify pre-opening access repair
on:
  push:
    branches: [fix/mealdeck-test-checkout-access-20261106]
    paths: [.github/workflows/preopening-access-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'asaffilate01-ship-it/pixel-perfect-71'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact reviewed patch without changing workflows
        shell: python
        run: |
          import base64,gzip,hashlib,subprocess
          expected = {'src/components/group-order-room.tsx':'39b8086809694e5eb0aaf40844494cf21965bb55','src/components/launch-checkout.tsx':'662aa4c56f2ead13831c5638fe65c8fff2596f71','src/lib/mealdeck-checkout-browser.ts':'28ba730da7a149e549f815800517bc43f638c614','src/lib/mealdeck-group-rooms-browser.ts':'6f6558a8029ea032e1c492e6eb84cb08ac00fc9b','src/lib/mealdeck-group-rooms.server.ts':'e9b3f095d50007343de5ff473deeb11ef0ed6783','src/lib/mealdeck-online-checkout.server.ts':'a415f394f486dc8f44f8e5262795a08649c20325','src/lib/mealdeck-payment-server-core.ts':'399839084618d0640132d7eb89f5327b1bb4eb18','src/lib/mealdeck-shared-payments-browser.ts':'9b5052e0c88979134e73316e3fdacb2262bc2dad','src/lib/mealdeck-shared-payments.server.ts':'d110849bd55ffdf39af2687500768f0b701d86c3','tests/mealdeck-checkout-browser.test.ts':'2b567c35290c623f5742ded62f82b89b47f183c9','tests/mealdeck-online-checkout.test.ts':'8b2d42fb00c2f0285741ef587878696f27cbdeb7'}
          for path,sha in expected.items():
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path+' changed; stop rather than overwrite'
          payload=''''''
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='fb3d962add808317232aae1c923fcf972505892d9ada46d795424a4ac7f21c65'
          subprocess.run(['git','apply','--check','--index','--whitespace=error-all','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error-all','-'],input=patch,check=True)
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format and verify repair
        run: |
          set -euo pipefail
          git diff --cached --name-only -z | xargs -0 bunx --no-install prettier --write
          git diff --cached --name-only -z | xargs -0 git add --
          bun test tests/mealdeck-online-checkout.test.ts tests/mealdeck-checkout-browser.test.ts tests/mealdeck-shared-payments-server.test.ts tests/mealdeck-group-rooms.test.ts tests/mealdeck-order-payments-server.test.ts
          bunx --no-install tsc --noEmit
          bun run build
          git diff --cached --check
      - name: Commit only the reviewed source to this branch
        run: |
          set -euo pipefail
          target='fix/mealdeck-test-checkout-access-20261106'
          test "$GITHUB_REF" = "refs/heads/$target"
          test "$(git ls-remote origin "refs/heads/$target" | cut -f1)" = "$GITHUB_SHA"
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'MealDeck Build'
          git config user.email 'build@mealdeck.invalid'
          git commit -m 'Connect verified pre-opening test access to checkout and group rooms'
          git push origin "HEAD:refs/heads/$target"
