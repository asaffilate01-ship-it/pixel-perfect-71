name: Verify prelaunch checkout access
on:
  push:
    paths:
      - 'src/lib/mealdeck-*'
      - 'src/components/launch-checkout.tsx'
      - 'src/components/group-order-room.tsx'
      - 'tests/mealdeck-prelaunch-status.test.ts'
      - '.github/workflows/prelaunch-status-verify.yml'
  pull_request:
    paths:
      - 'src/lib/mealdeck-*'
      - 'src/components/launch-checkout.tsx'
      - 'src/components/group-order-room.tsx'
      - 'tests/mealdeck-prelaunch-status.test.ts'
      - '.github/workflows/prelaunch-status-verify.yml'
permissions:
  contents: read
jobs:
  prelaunch-access:
    name: Authenticated tester isolation and public opening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify private status, account isolation, boundary times and transport
        run: bun test tests/mealdeck-prelaunch-status.test.ts tests/mealdeck-checkout-browser.test.ts
      - name: Validate prelaunch test source
        run: bunx --no-install eslint tests/mealdeck-prelaunch-status.test.ts
