name: Verify owned marketplace connectors
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  kitchen-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mealdeck_disposable_ci_only
          POSTGRES_DB: mealdeck_kds_test_marketplaces
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mealdeck_kds_test_marketplaces"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix tests/postgres --ignore-scripts
      - name: KDS, HTTP boundaries and full HTTP-to-database contracts
        run: >-
          bun test tests/mealdeck-marketplace-bridge-server.test.ts
          tests/mealdeck-marketplace-connections.test.tsx
          tests/mealdeck-marketplace-http-postgres.test.ts
          tests/mealdeck-marketplace-kds.test.ts
          tests/mealdeck-kds.test.ts tests/mealdeck-kds-workflow.test.ts
          tests/mealdeck-kds-readiness.test.ts tests/mealdeck-kds-presentation.test.ts
          tests/mealdeck-kds-view.test.ts tests/mealdeck-kds-toolbar.test.ts
      - name: Native PostgreSQL authority, lifecycle and concurrent claim/revocation races
        env:
          MEALDECK_KDS_TEST_DATABASE_URL: postgresql://postgres:mealdeck_disposable_ci_only@127.0.0.1:5432/mealdeck_kds_test_marketplaces
        run: node tests/postgres/marketplace-behavior.mjs --native
      - run: bun run build
      - run: bunx tsc --noEmit

  local-bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mealdeck-marketplace-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Local UI transports, identity checks and crash recovery
        env:
          MEALDECK_REQUIRE_BROWSER_TESTS: "1"
        run: npm test
      - run: npm run demo
      - run: npm run check -- --config config.uber-eats.example.json
      - run: npm run check -- --config config.just-eat.example.json
