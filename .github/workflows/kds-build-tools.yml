name: KDS isolated build tools
on:
  push:
    branches: [feature/mealdeck-kds-six-stages-20261106]
    paths: [.github/workflows/kds-build-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Generate migration with official CLI
        run: |
          supabase --help
          supabase migration new --help
          supabase migration new mealdeck_kds_done_history
          mkdir -p kds-tools
          cp supabase/migrations/*_mealdeck_kds_done_history.sql kds-tools/
          cp "$(command -v bun)" kds-tools/bun
      - name: Install locked verification dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix tests/postgres
          tar -czf kds-tools/dependencies.tar.gz node_modules tests/postgres/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: kds-verification-tools
          path: kds-tools/
          retention-days: 1
