name: H10S live receipt APK

on:
  push:
    branches: ['feat/own-driver-luton-delivery']
    paths:
      - "apps/mealdeck-printer/**"
      - "tools/receipt-bridge/receipt.mjs"
      - ".github/workflows/printer-live.yml"
      - ".github/workflows/publish-printer-v023.yml"
      - "src/components/ops/printer-apk-download.tsx"
  pull_request:
    paths:
      - "apps/mealdeck-printer/**"
      - "tools/receipt-bridge/receipt.mjs"
      - "tools/receipt-bridge/receipt-games-qr.mjs"
      - "tools/receipt-bridge/receipt-promotion*.mjs"
      - "tools/receipt-bridge/build-receipt-promotions.mjs"
      - "tools/receipt-bridge/build-promotion-logos.py"
      - "tools/receipt-bridge/assets/receipt-promo-*.png"
      - "tools/receipt-bridge/test/fixtures.mjs"
      - "tools/receipt-bridge/assets/mealdeck-thermal-logo.png"
      - "src/assets/approved-logos/**"
      - ".github/workflows/printer-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h10s-receipt-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  printer-live-android:
    name: H10S receipt companion Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mealdeck-printer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mealdeck-printer/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned app and artwork dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check 'Pillow==12.0.0'
      - name: Check screen and native receipt behavior
        run: |
          npm run typecheck
          npm run test:web
          npm run test:native-core
          node native/generate-receipt-fixtures.mjs --check
          node native/generate-receipt-games-qr.mjs --check
      - name: Bundle the local operator screen and verify boundaries
        run: |
          npm run sync:android
          npm run verify:native
      - name: Install Android compiler components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile the non-debuggable release APK
        working-directory: apps/mealdeck-printer/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify all receipt promotions and bitmap plus final feed on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: apps/mealdeck-printer/android
          script: >-
            receipt_test_status=0;
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || receipt_test_status=$?;
            mkdir -p ../dist/receipt-render-tests;
            adb root && adb wait-for-device &&
            adb pull /data/user/0/uk.co.mealdeck.printer/cache/receipt-render-tests/. ../dist/receipt-render-tests/
            || receipt_test_status=1;
            exit "$receipt_test_status"
      - name: Upload Android receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mealdeck-printer-android-receipt-tests
          path: |
            apps/mealdeck-printer/dist/receipt-render-tests/
            apps/mealdeck-printer/android/app/build/reports/androidTests/connected/
            apps/mealdeck-printer/android/app/build/outputs/androidTest-results/connected/
          retention-days: 30
          if-no-files-found: warn
      - name: Prepare aligned v0.2.3 for private signing with the existing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/signing-tools
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="dist/mealdeck-printer-h10s-0.2.3-unsigned.apk"
          "$TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$APK"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/aapt" dump permissions "$APK" > dist/permissions.txt
          "$TOOLS/aapt" dump badging "$APK" > dist/package.txt
          grep -q "package: name='uk.co.mealdeck.printer' versionCode='5' versionName='0.2.3'" dist/package.txt
          if grep -q 'application-debuggable' dist/package.txt; then
            echo 'Release APK must not be debuggable'
            exit 1
          fi
          # Only the public signer certificate is retained. No key is generated.
          "$TOOLS/apksigner" verify --verbose --print-certs ../../public/downloads/mealdeck-printer-h10s-0.2.2.apk > dist/installed-v022-signature.txt
          cp "$TOOLS/lib/apksigner.jar" dist/signing-tools/apksigner.jar
          git rev-parse HEAD > dist/source-commit.txt
          printf '%s\n' 'UNSIGNED v0.2.3/build 5. Must be signed with the original v0.2.2 key and verified against installed-v022-signature.txt before publication. Never uninstall the existing app or use a replacement signing key.' > dist/RELEASE-STATUS.txt
          cd dist
          sha256sum mealdeck-printer-h10s-0.2.3-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mealdeck-printer-h10s-v023-release-unsigned
          path: apps/mealdeck-printer/dist/
          retention-days: 30
          if-no-files-found: error
