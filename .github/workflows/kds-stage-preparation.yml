name: Prepare KDS verification
on:
  push:
    branches: [feature/mealdeck-six-stage-kds-20261106]
    paths: [.github/workflows/kds-stage-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Generate migration with official Supabase CLI
        run: |
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help
          npx --yes supabase@2.81.3 migration new mealdeck_kds_six_stages
          mkdir -p /tmp/kds-tools/migrations
          cp supabase/migrations/*_mealdeck_kds_six_stages.sql /tmp/kds-tools/migrations/
      - name: Prepare isolated local test dependencies
        run: |
          npm ci --prefix tests/postgres --ignore-scripts
          cp -a tests/postgres/node_modules /tmp/kds-tools/
          npm install --prefix /tmp/kds-additions --ignore-scripts --no-audit --no-fund zod@4.6.5
          cp -a /tmp/kds-additions/node_modules/zod /tmp/kds-tools/node_modules/
          cp "$(which bun)" /tmp/kds-tools/bun
          tar -czf kds-verification-tools.tar.gz -C /tmp/kds-tools .
      - uses: actions/upload-artifact@v4
        with:
          name: kds-verification-tools
          path: kds-verification-tools.tar.gz
          retention-days: 1
