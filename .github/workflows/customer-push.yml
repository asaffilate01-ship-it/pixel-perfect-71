permissions:
  contents: read

concurrency:
  group: customer-push-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer-push:
    name: Browser, server, service worker and encrypted transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - name: Exercise consent, identity, delivery outcomes and safe notification navigation
        run: >-
          bun test
          tests/mealdeck-order-notifications-browser.test.ts
          tests/mealdeck-notification-campaigns-browser.test.ts
          tests/mealdeck-notifications-server.test.ts
          tests/mealdeck-web-push.test.ts
          tests/mealdeck-push-service-worker.test.ts
          tests/mealdeck-customer.test.ts
          tests/mealdeck-customer-return.test.ts
          tests/mealdeck-checkout-browser.test.ts
          tests/mealdeck-pwa.test.ts
          tests/mealdeck-pwa-provider.test.ts
      - name: Lint notification implementation and isolated tests
        run: >-
          bunx --no-install eslint
          public/sw.js
          src/lib/mealdeck-customer-notifications.ts
          src/lib/mealdeck-order-notifications-browser.ts
          src/lib/mealdeck-notification-campaigns-browser.ts
          src/lib/mealdeck-notifications.server.ts
          src/lib/mealdeck-web-push.server.ts
          src/lib/mealdeck-push-runtime.server.ts
          src/routes/api.notifications.ts
          src/routes/api.notifications.worker.ts
          src/routes/api.ops.notifications.ts
          src/components/order-notifications-card.tsx
          src/components/ops/notification-campaign-panel.tsx
          tests/mealdeck-order-notifications-browser.test.ts
          tests/mealdeck-notification-campaigns-browser.test.ts
          tests/mealdeck-notifications-server.test.ts
          tests/mealdeck-web-push.test.ts
          tests/mealdeck-push-service-worker.test.ts

  customer-push-postgres17:
    name: PostgreSQL 17 — ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [customer-push, push-hosted-dispatch]
    # Each matrix job receives an empty database. The harness intentionally
    # refuses to reuse a populated database or connect to a remote project.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mealdeck_disposable_ci_only
          POSTGRES_DB: mealdeck_kds_test_customer_push
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealdeck_kds_test_customer_push"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated locked PostgreSQL test dependencies
        run: npm ci --prefix tests/postgres
      - name: Exercise scoped consent, queue transitions and hosted dispatch boundaries
        env:
          MEALDECK_KDS_TEST_DATABASE_URL: postgresql://postgres:mealdeck_disposable_ci_only@127.0.0.1:5432/mealdeck_kds_test_customer_push
          MEALDECK_TEST_SUITE: ${{ matrix.suite }}
        run: node "tests/postgres/${MEALDECK_TEST_SUITE}-behavior.mjs" --native
