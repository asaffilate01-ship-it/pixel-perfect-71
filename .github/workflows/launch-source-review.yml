name: Launch source review
on:
  push:
    branches: [feature/mealdeck-launch-access-20261106]
    paths: [.github/workflows/launch-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output=mealdeck-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mealdeck-source-review
          path: mealdeck-source.tar.gz
          retention-days: 1
