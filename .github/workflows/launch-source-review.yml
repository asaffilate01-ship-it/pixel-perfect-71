name: Launch source review
on:
  push:
    branches: [feature/mealdeck-launch-access-20261106]
    paths: [.github/workflows/launch-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify outstanding branches without changing refs
        shell: bash
        run: |
          set -euo pipefail
          printf 'MAIN %s\n' "$(git rev-parse origin/main)"
          while IFS= read -r ref; do
            [[ "$ref" == "origin/HEAD" || "$ref" == "origin/main" ]] && continue
            git merge-base --is-ancestor "$ref" origin/main && continue
            printf '\nBRANCH %s %s\n' "$ref" "$(git rev-parse "$ref")"
            git cherry origin/main "$ref" | awk '$1=="+" {unique++} $1=="-" {equivalent++} END {printf "PATCHES unique=%d equivalent=%d\n",unique,equivalent}'
            if git merge-tree --write-tree --name-only origin/main "$ref" > "$RUNNER_TEMP/merge-audit.txt"; then
              tree=$(head -n1 "$RUNNER_TEMP/merge-audit.txt")
              printf 'CLEAN_MERGE_TREE %s\n' "$tree"
              git diff --stat origin/main "$tree"
            else
              printf 'CONFLICTS_REQUIRE_MANUAL_PORT\n'
              sed -n '2,24p' "$RUNNER_TEMP/merge-audit.txt"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)
