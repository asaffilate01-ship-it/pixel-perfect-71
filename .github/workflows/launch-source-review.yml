name: Launch source review
on:
  push:
    branches: [feature/mealdeck-launch-access-20261106]
    paths: [.github/workflows/launch-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit branches not yet contained in main
        shell: bash
        run: |
          set -euo pipefail
          printf 'MAIN %s\n' "$(git rev-parse origin/main)"
          total=0
          outstanding=0
          while IFS= read -r ref; do
            [[ "$ref" == "origin/HEAD" || "$ref" == "origin/main" ]] && continue
            total=$((total+1))
            if ! git merge-base --is-ancestor "$ref" origin/main; then
              outstanding=$((outstanding+1))
              printf '\nOUTSTANDING %s %s\n' "$ref" "$(git rev-parse "$ref")"
              git rev-list --left-right --count "origin/main...$ref"
              git log --format='%h %s' "origin/main..$ref"
              git diff --stat "origin/main...$ref"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)
          printf '\nAUDIT branches=%s outstanding=%s\n' "$total" "$outstanding"
