name: Launch source review
on:
  push:
    branches: [feature/mealdeck-launch-access-20261106]
    paths: [.github/workflows/launch-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install locked verification dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix tests/postgres --ignore-scripts
          mkdir -p .validation-tools
          cp "$(command -v bun)" .validation-tools/bun
          npx --yes supabase@3.0.0 migration --help
          npx --yes supabase@3.0.0 migration new mealdeck_launch_test_access
          find supabase/migrations -name '*_mealdeck_launch_test_access.sql' -printf '%f\n' > .validation-tools/migration-name.txt
      - name: Archive isolated verification environment without credentials
        run: tar -czf mealdeck-validation.tar.gz node_modules tests/postgres/node_modules .validation-tools
      - uses: actions/upload-artifact@v4
        with:
          name: mealdeck-validation
          path: mealdeck-validation.tar.gz
          retention-days: 1
