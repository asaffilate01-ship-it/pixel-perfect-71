name: Assemble verified staff activation
on:
  push:
    branches: [feature/mealdeck-staff-live-20261106]
    paths: [.github/workflows/staff-activation-build.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mealdeck-staff-live-20261106
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply the unchanged reviewed patch from its immutable source commit
        run: |
          git show bdc161132b100f7b7bc0f9109d8d806131cde3dc:.github/workflows/staff-activation-build.yml > /tmp/mealdeck-reviewed-assembly.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/mealdeck-reviewed-assembly.yml').read_text()
          start=text.index('          from pathlib import Path\n')
          end=text.index('      - name: Verify assembled source\n', start)
          lines=text[start:end].splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          Path('/tmp/mealdeck-reviewed-assembly.py').write_text('\n'.join(line[10:] if line else '' for line in lines)+'\n')
          PY
          python3 /tmp/mealdeck-reviewed-assembly.py
      - name: Verify assembled source
        run: |
          git diff --check
          bun install --frozen-lockfile
          npm ci --prefix tests/postgres --ignore-scripts
          bun test tests
          bunx tsc --noEmit
          bunx eslint src/lib/mealdeck-cloud-connection.ts src/lib/mealdeck-deployment.server.ts src/lib/mealdeck-backend.functions.ts tests/mealdeck-cloud-connection.test.ts --rule 'prettier/prettier: off'
          bun run build
          node --experimental-strip-types --experimental-transform-types tests/postgres/kitchen-printer-behavior.mjs
          node --test tools/receipt-bridge/test/*.test.mjs
      - name: Commit verified source to its review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs .github/workflows
          git commit -m 'Connect approved MealDeck Cloud backend and repair staff printer reconnect'
          git push origin HEAD:feature/mealdeck-staff-live-20261106
