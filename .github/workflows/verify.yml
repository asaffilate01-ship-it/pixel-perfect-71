  terminal-android:
    name: Staff Android native compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mealdeck-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mealdeck-terminal/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install locked app dependencies
        run: npm ci
      - name: Native API, recovery and type checks
        run: |
          npm run typecheck
          npm test
      - name: Generate the pinned native projects and verify Tap to Pay configuration
        env:
          CI: "1"
        run: |
          npm run prebuild -- --clean --no-install
          npm run check:native
          npm run export:check
      - name: Install Android compiler components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Prepare pinned staff Gradle wrapper with resilient download
        working-directory: apps/mealdeck-terminal/android
        run: |
          set -euo pipefail
          wrapper=gradle/wrapper/gradle-wrapper.properties
          test -f "$wrapper"
          if grep -q '^networkTimeout=' "$wrapper"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$wrapper"
          else
            printf '\nnetworkTimeout=120000\n' >> "$wrapper"
          fi
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Pinned staff Gradle wrapper download failed after retries.'
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Compile an Android debug APK without production credentials
        working-directory: apps/mealdeck-terminal/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mealdeck-staff-android-debug
          path: apps/mealdeck-terminal/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  terminal-ios:
    name: Staff iPhone unsigned simulator compilation
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/mealdeck-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mealdeck-terminal/package-lock.json
      - name: Verify the Expo 56 native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install locked app dependencies and generate native projects
        env:
          CI: "1"
        run: |
          npm ci
          npm run prebuild -- --clean --no-install
          npm run check:native
      - name: Resolve iOS native dependencies
        working-directory: apps/mealdeck-terminal/ios
        run: pod install
      - name: Compile the staff app and merchant education bridge without signing
        run: >-
          xcodebuild -workspace ios/MealDeckStaff.xcworkspace -scheme MealDeckStaff
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
