name: Verify MealDeck
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Bun from npm registry
        run: |
          npm install --global bun@1.4.4 --no-audit --no-fund
          test "$(bun --version)" = "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Luton own-driver delivery migration safety contract
        run: node --test tests/delivery-migration-source.test.mjs
      - name: WhatsApp conversation, transport and private checkout boundaries
        run: bun test tests/mealdeck-whatsapp-*.test.ts tests/mealdeck-customer-return.test.ts
      - name: WhatsApp implementation lint and worker syntax
        run: |
          node --check apps/mealdeck-whatsapp-worker/worker.mjs
          bunx eslint src/lib/mealdeck-whatsapp*.ts src/routes/api.whatsapp*.ts src/routes/api.ops.whatsapp.ts src/routes/whatsapp.checkout.tsx src/components/whatsapp*.tsx src/components/ops/whatsapp-inbox-panel.tsx tests/mealdeck-whatsapp*.test.ts deploy/mealdeck/whatsapp-ordering.mjs tests/postgres/whatsapp-ordering-behavior.mjs --rule 'prettier/prettier: off'
      - name: Launch menu prices, basket arithmetic and cross-brand choices
        run: bun test tests/launch-menu-catalogue.test.ts tests/mealdeck-menu-item-descriptor.test.ts tests/launch-menu-picks.test.ts tests/launch-menu-upsells.test.ts tests/launch-menu-desserts.test.ts tests/launch-menu-navigation.test.ts tests/launch-menu-display-prices.test.ts tests/launch-basket-feedback.test.ts tests/mealdeck-public-menu.test.ts tests/mealdeck-public-menu-server.test.ts
      - name: Sunday milkcakes show the exact final promotional amount
        run: bun test tests/mealdeck-milkcake-promotion.test.ts
      - name: Sunday milkcake promotion implementation lint
        run: >-
          bunx eslint src/lib/mealdeck-milkcake-promotion.ts
          src/components/menus/milkcake-offer-terms.tsx
          tests/mealdeck-milkcake-promotion.test.ts
          deploy/mealdeck/milkcake-offer.mjs tests/postgres/milkcake-offer-behavior.mjs
          --rule 'prettier/prettier: off'
      - name: Launch menu and approved logo implementation lint
        run: >-
          bunx eslint src/lib/launch-menu-catalogue.ts src/lib/launch-menu-item-descriptor.ts src/lib/launch-menu-picks.ts
          src/lib/launch-menu-upsells.ts
          src/lib/launch-menu-desserts.ts
          src/lib/launch-menu-display-prices.ts
          src/lib/mealdeck-public-menu.ts src/lib/mealdeck-public-menu.server.ts
          src/components/menus/use-public-menu.ts src/components/menus/public-menu-status.tsx
          src/lib/brand-logos.ts src/components/mealdeck-logo.tsx
          src/components/menus/launch-menu-browser.tsx src/routes/menus.tsx
          src/components/menus/launch-basket.tsx src/components/menus/launch-item-customiser.tsx
          src/components/menus/launch-menu-mobile-nav.tsx src/lib/launch-menu-navigation.ts src/routes/menu.tsx
          src/components/menus/launch-menu-app-nav.tsx
          src/components/ui/dialog.tsx src/components/ui/sheet.tsx
          src/components/menus/launch-basket-feedback.tsx
          tests/launch-menu-catalogue.test.ts tests/mealdeck-menu-item-descriptor.test.ts tests/launch-menu-picks.test.ts
          tests/launch-menu-upsells.test.ts
          tests/launch-menu-desserts.test.ts
          tests/launch-menu-navigation.test.ts
          tests/launch-menu-display-prices.test.ts
          tests/launch-basket-feedback.test.ts
          deploy/mealdeck/public-menu-read.mjs tests/postgres/public-menu-read-behavior.mjs
          deploy/mealdeck/milkcake-desserts.mjs tests/postgres/milkcake-desserts-behavior.mjs
          deploy/mealdeck/included-drink-stock.mjs tests/postgres/included-drink-stock-behavior.mjs
          --rule 'prettier/prettier: off'
      - name: Installable app cache isolation and offline behavior
        run: bun test tests/mealdeck-pwa.test.ts tests/mealdeck-pwa-provider.test.ts tests/mealdeck-mobile-safe-area.test.ts
      - name: MealDeck own-driver PWA state and privacy contract
        run: bun test tests/mealdeck-driver-app-view.test.ts tests/mealdeck-driver-app-contract.test.ts tests/mealdeck-driver-gps-readiness.test.ts
      - name: Driver UI contract and dispatch implementation lint
        run: |
          node --check public/driver-sw.js
          bunx eslint src/lib/mealdeck-driver-app-view.ts src/lib/mealdeck-driver-browser.ts src/lib/mealdeck-driver-gps-readiness.ts src/components/driver/driver-workspace.tsx src/components/driver/driver-gps-readiness.tsx src/components/ops/driver-dispatch-panel.tsx src/routes/driver.tsx tests/mealdeck-driver-app-view.test.ts tests/mealdeck-driver-gps-readiness.test.ts --rule 'prettier/prettier: off'
      - name: Page loading and failed-route recovery
        run: node --conditions=development --import tsx --test tests/mealdeck-route-recovery.test.tsx tests/mealdeck-arcade-navigation.test.tsx
      - name: Installable app implementation checks
        run: |
          node --check public/sw.js
          node --check public/kds-sw.js
          node --check public/printer-sw.js
          bunx eslint src/components/pwa-provider.tsx src/components/pwa-install-card.tsx src/lib/mealdeck-pwa-context.ts tests/mealdeck-pwa.test.ts tests/mealdeck-pwa-provider.test.ts tests/mealdeck-mobile-safe-area.test.ts
      - name: Verified customer checkout, packing, receipt printing and distinct staff alerts
        run: >-
          bun test tests/mealdeck-order-number.test.ts tests/mealdeck-order-notes.test.ts tests/mealdeck-customer.test.ts tests/mealdeck-account-entry.test.ts tests/mealdeck-customer-orders.test.ts tests/mealdeck-online-checkout.test.ts
          tests/mealdeck-launch-schedule.test.ts tests/mealdeck-guest-checkout.test.ts tests/mealdeck-own-driver-delivery.test.ts
          tests/mealdeck-checkout-browser.test.ts
          tests/mealdeck-checkout-feedback.test.ts
          tests/mealdeck-kds-readiness.test.ts tests/mealdeck-printer.test.ts
          tests/mealdeck-printer-auth.test.ts
          tests/mealdeck-printer-config.test.ts
          tests/mealdeck-printer-acceptance.test.ts
          tests/mealdeck-kds-toolbar.test.ts
          tests/mealdeck-staff-alerts.test.ts
          tests/mealdeck-staff-audio.test.ts
          tests/mealdeck-staff-vibration.test.ts
          tests/mealdeck-staff-alert-delivery.test.ts
          tests/mealdeck-staff-alert-controls.test.tsx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible receipt artwork dependency
        run: python -m pip install "Pillow==13.0.0"
      - name: Receipt bridge one-copy delivery, pairing and canonical order verification
        run: |
          node tools/receipt-bridge/build-games-qr.mjs --check
          node --test tools/receipt-bridge/test/*.test.mjs
      - name: Receipt bridge and printer terminal implementation lint
        run: >-
          bunx eslint tools/receipt-bridge src/routes/printer.tsx
          src/components/ops/printer-workspace.tsx src/components/ops/receipt-preview.tsx
          src/components/ops/staff-alerts.tsx src/lib/mealdeck-printer.ts
          src/lib/mealdeck-printer-browser.ts src/lib/mealdeck-printer-recovery.ts
          src/lib/mealdeck-printer-auth.ts tests/mealdeck-printer-auth.test.ts
          src/components/ops/printer-pending-orders.tsx src/lib/mealdeck-printer-acceptance.ts
          src/components/ops/printer-receipt-list.tsx src/lib/mealdeck-printer-queue.ts
          tests/mealdeck-printer-acceptance.test.ts
          deploy/mealdeck/printer-acceptance.mjs tests/postgres/printer-acceptance-behavior.mjs
          deploy/mealdeck/receipt-archive.mjs tests/postgres/receipt-archive-behavior.mjs
          src/lib/mealdeck-staff-alerts.ts tests/mealdeck-printer.test.ts
          src/lib/mealdeck-staff-audio.ts tests/mealdeck-staff-audio.test.ts
          src/lib/mealdeck-staff-vibration.ts tests/mealdeck-staff-vibration.test.ts
          tests/mealdeck-staff-alert-delivery.test.ts tests/mealdeck-staff-alert-controls.test.tsx
          src/lib/mealdeck-receipt-logo.ts src/lib/mealdeck-meal-components.ts
          src/lib/mealdeck-receipt-games.ts
          tests/mealdeck-staff-alerts.test.ts
          --rule 'prettier/prettier: off'
      - name: Customer launch implementation lint
        run: >-
          bunx eslint src/lib/mealdeck-order-number.ts tests/mealdeck-order-number.test.ts
          deploy/mealdeck/paid-order-numbers.mjs tests/postgres/paid-order-numbers-behavior.mjs
          tests/postgres/paid-order-numbers-fixture.mjs tests/postgres/paid-order-numbers-concurrency.mjs
          src/lib/mealdeck-order-notes.ts tests/mealdeck-order-notes.test.ts
          deploy/mealdeck/order-notes.mjs tests/postgres/order-notes-behavior.mjs
          tests/postgres/order-notes-fixture.mjs
          src/components/customer-account.tsx src/components/customer-orders.tsx
          src/lib/mealdeck-customer.ts src/lib/mealdeck-account-entry.ts src/lib/mealdeck-customer-orders.ts
          src/lib/mealdeck-customer-browser.ts src/lib/mealdeck-customer.functions.ts
          src/lib/mealdeck-customer-notifications.ts src/routes/account.tsx
          src/components/launch-checkout.tsx src/lib/mealdeck-online-checkout.server.ts
          src/lib/mealdeck-checkout-selection.ts src/lib/mealdeck-stripe.server.ts
          src/lib/mealdeck-opening-offer.ts src/lib/mealdeck-opening-offer.functions.ts
          src/lib/mealdeck-customer-order-timing.ts
          src/lib/mealdeck-own-driver-delivery.ts tests/mealdeck-own-driver-delivery.test.ts
          src/components/own-driver-offer-banner.tsx src/components/site-header.tsx src/components/location-page.tsx src/routes/index.tsx
          src/lib/mealdeck-guest.ts src/lib/mealdeck-guest-session.server.ts src/lib/mealdeck-launch-schedule.ts
          src/lib/mealdeck-checkout-browser.ts src/lib/mealdeck-group-launch.ts
          src/lib/mealdeck-kitchen-availability.ts
          src/routes/checkout.tsx src/routes/api.checkout.ts src/routes/api.stripe.webhook.ts
          src/components/opening-weekend-offer.tsx src/components/menus/menu-install-prompt.tsx
          src/lib/launch-basket-transfer.ts src/lib/mealdeck-pwa-surface.ts
          src/routes/meta-ad.tsx src/routes/opening-offer.tsx src/routes/privacy.tsx
          src/routes/luton.tsx src/components/location-page.tsx src/components/site-footer.tsx
          src/lib/mealdeck.ts src/lib/seo.ts
          src/components/ops/checkout-launch-settings.tsx
          tests/mealdeck-customer.test.ts tests/mealdeck-customer-orders.test.ts tests/mealdeck-online-checkout.test.ts
          tests/mealdeck-launch-schedule.test.ts tests/mealdeck-guest-checkout.test.ts
          tests/mealdeck-checkout-browser.test.ts
          tests/mealdeck-checkout-feedback.test.ts
          deploy/mealdeck/guest-checkout.mjs tests/postgres/guest-checkout-fixture.mjs
          tests/postgres/guest-checkout-behavior.mjs
          deploy/mealdeck/kitchen-availability.mjs
          tests/postgres/kitchen-availability-behavior.mjs
          deploy/mealdeck/kerbside-contact.mjs
          tests/postgres/kerbside-contact-behavior.mjs
          --rule 'prettier/prettier: off'
      - name: Franchise offer and enquiry regressions
        run: bun test tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
      - name: MealDeck Play game regressions
        run: bun test tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts tests/arcade-games.test.ts tests/mealdeck-arcade-library.test.ts tests/mealdeck-puzzle-games.test.ts tests/tray-tactics.test.ts tests/bento-sudoku.test.ts tests/tray-lines.test.ts tests/mealdeck-play-progress.test.ts tests/snack-trail.test.ts tests/skewer-sort.test.ts tests/pantry-sweep.test.ts tests/mealdeck-arcade-sharing.test.ts tests/mealdeck-arcade-share-card.test.ts tests/mealdeck-arcade-pages.test.ts tests/mealdeck-arcade-promotion.test.ts tests/mealdeck-arcade-qr.test.ts tests/hero-food-deck.test.ts
      - name: Homepage motion, native zoom and lifecycle cleanup
        run: |
          bun test tests/deck-motion.test.ts
          bunx eslint src/hooks/use-deck-motion.ts src/components/marketing/rotating-brand-deck.tsx src/components/mobile-tab-bar.tsx tests/deck-motion.test.ts --rule 'prettier/prettier: off'
      - name: Marketplace discovery, saved basket and category regressions
        run: bun test tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts tests/mealdeck-preview-basket.test.ts
      - name: Sample-deck arithmetic and accessibility implementation lint
        run: >-
          bunx eslint src/lib/mealdeck-preview-basket.ts
          tests/mealdeck-preview-basket.test.ts
          --rule 'prettier/prettier: off'
      - name: "WhatsApp assistant test: privacy, validation and multi-brand handoff"
        run: bun test tests/whatsapp-assistance.test.ts
      - name: MealDeck backend staff, costing, analytics and RLS source contracts
        run: >-
          bun test tests/mealdeck-ops.test.ts tests/mealdeck-menu-manager.test.ts
          tests/mealdeck-menu-choice-editor.test.ts tests/mealdeck-menu-structure.test.ts
      - name: Private payment and email connection diagnostics
        run: bun test tests/mealdeck-integration-status.test.ts tests/mealdeck-checkout-domain.test.ts
      - name: Staff cash order authority and interrupted-attempt recovery
        run: bun test tests/mealdeck-cash-orders.test.ts tests/mealdeck-cash-recovery.test.ts
      - name: Staff cash ordering and canonical meal projection implementation checks
        run: >-
          bunx eslint src/components/ops/cash-order-panel.tsx
          src/lib/mealdeck-cash-orders.ts src/lib/mealdeck-cash-orders.server.ts
          src/lib/mealdeck-cash-recovery.ts src/routes/api.ops.cash.ts
          tests/mealdeck-cash-orders.test.ts tests/mealdeck-cash-recovery.test.ts
          deploy/mealdeck/staff-cash-orders.mjs deploy/mealdeck/meal-components.mjs
          tests/postgres/staff-cash-orders-fixture.mjs
          tests/postgres/staff-cash-orders-behavior.mjs
          tests/postgres/staff-cash-orders-concurrency.mjs
          tests/postgres/meal-components-behavior.mjs
          --rule 'prettier/prettier: off'
      - name: Payment and email diagnostics implementation checks
        run: >-
          bunx eslint src/lib/mealdeck-integration-status.ts src/lib/mealdeck-integration-status.server.ts
          src/routes/api.ops.integrations.ts src/components/ops/integration-status-panel.tsx
          src/lib/mealdeck-checkout-url.ts src/lib/mealdeck-stripe-checkout-domain.server.ts
          tests/mealdeck-integration-status.test.ts tests/mealdeck-checkout-domain.test.ts
          deploy/mealdeck/checkout-domain.mjs deploy/mealdeck/checkout-session-paths.mjs
          tests/postgres/checkout-domain-behavior.mjs
          --rule 'prettier/prettier: off'
      - name: Shared kitchen board, strict feed and full-order presentation
        run: bun test tests/mealdeck-kds*.test.ts
      - name: Supplier, purchase approval, stock batch and expiry regressions
        run: bun test tests/mealdeck-procurement.test.ts
      - name: Supplier invoice, VAT review and credit-note regressions
        run: bun test tests/mealdeck-invoice-matching.test.ts
      - run: bun run build
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Franchise implementation lint
        run: >
          bunx eslint src/routes/franchise.tsx src/routes/api.franchise.ts
          src/lib/franchise-offer.ts src/lib/franchise-api.ts
          src/lib/franchise-selection.ts src/lib/franchise-brands.ts
          src/components/franchise/*.tsx
          'src/routes/franchise_.$brandId.tsx'
          tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
          --rule 'prettier/prettier: off'

      - name: Game module lint
        run: >
          bunx eslint src/lib/dishbee-play.ts src/lib/kitchen-chaos.ts
          src/lib/mealdeck-collection-games.ts src/lib/game-brand-artwork.ts src/lib/arcade-games.ts
          src/components/play/premium-games.tsx src/components/play/arcade-games.tsx src/routes/play.tsx
          tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts tests/arcade-games.test.ts
          src/lib/mealdeck-arcade-library.ts src/lib/mealdeck-puzzle-games.ts src/lib/tray-tactics.ts
          src/components/play/puzzle-games.tsx src/components/play/tray-tactics.tsx
          src/components/play/game-panel-boundary.tsx
          tests/mealdeck-arcade-library.test.ts tests/mealdeck-puzzle-games.test.ts tests/tray-tactics.test.ts
          src/lib/bento-sudoku.ts src/lib/tray-lines.ts src/lib/mealdeck-play-progress.ts
          src/components/play/bento-sudoku.tsx src/components/play/tray-lines.tsx src/components/play/arcade-progress.tsx
          tests/bento-sudoku.test.ts tests/tray-lines.test.ts tests/mealdeck-play-progress.test.ts
          src/lib/snack-trail.ts src/lib/skewer-sort.ts src/lib/pantry-sweep.ts
          src/components/play/snack-trail.tsx src/components/play/skewer-sort.tsx src/components/play/pantry-sweep.tsx
          tests/snack-trail.test.ts tests/skewer-sort.test.ts tests/pantry-sweep.test.ts
          src/lib/mealdeck-arcade-sharing.ts src/lib/mealdeck-arcade-share-card.ts src/components/play/arcade-share.tsx
          tests/mealdeck-arcade-sharing.test.ts tests/mealdeck-arcade-share-card.test.ts
          src/components/play/arcade-page.tsx src/components/play/arcade-promotion-kit.tsx
          src/lib/mealdeck-arcade-pages.ts src/lib/mealdeck-arcade-promotion.ts src/lib/mealdeck-arcade-qr.ts
          'src/routes/play_.$gameId.tsx' src/routes/play_.daily.tsx src/routes/play_.receipt.tsx src/routes/play_.promote.tsx
          tests/mealdeck-arcade-pages.test.ts tests/mealdeck-arcade-promotion.test.ts tests/mealdeck-arcade-qr.test.ts
          tools/games-promotion/create-manifest.ts
          --rule 'prettier/prettier: off'

      - name: Marketplace ordering lint
        run: >
          bunx eslint src/routes/order.tsx
          src/lib/marketplace-discovery.ts src/lib/marketplace-preferences.ts
          src/lib/marketplace-photos.ts src/components/order/premium-discovery.tsx
          tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts
          --rule 'prettier/prettier: off'

      - name: WhatsApp handoff and preview lint
        run: >
          bunx eslint src/lib/whatsapp-assistance.ts
          src/lib/whatsapp-assistance.functions.ts
          src/components/order/whatsapp-basket-handoff.tsx
          src/components/coming-soon.tsx
          tests/whatsapp-assistance.test.ts
          --rule 'prettier/prettier: off'

      - name: Staff console lint
        run: >
          bunx eslint src/routes/ops.tsx src/routes/kds.tsx
          src/components/ops/operations-workspace.tsx src/components/ops/kds-panel.tsx
          src/components/ops/kds-completed-card.tsx src/components/ops/kds-pickup-details.tsx
          src/components/ops/kds-ticket-grid.tsx src/components/ops/kds-order-navigator.tsx
          src/components/ops/kds-meal-components.tsx
          src/lib/mealdeck-kds.ts src/lib/mealdeck-kds-presentation.ts
          tests/mealdeck-kds*.test.ts
          src/components/ops/ops-panels.tsx src/components/ops/menu-manager.tsx
          src/lib/mealdeck-menu-manager.ts src/lib/mealdeck-kds-view.ts
          src/lib/mealdeck-kds-preferences.ts tests/mealdeck-kds-toolbar.test.ts
          tests/mealdeck-menu-manager.test.ts
          src/components/ops/menu-kitchen-route.tsx
          src/components/ops/menu-categories-panel.tsx
          src/components/ops/modifier-prices-panel.tsx
          src/lib/mealdeck-ops-browser.ts src/lib/mealdeck-ops-access.ts
          src/lib/mealdeck-ops-modifier-prices.ts src/lib/mealdeck-ops-menu-structure.ts
          src/lib/mealdeck-menu-choice-editor.ts
          src/lib/mealdeck-ops-math.ts src/lib/mealdeck-ops-types.ts
          tests/mealdeck-ops.test.ts tests/mealdeck-menu-choice-editor.test.ts
          tests/mealdeck-menu-structure.test.ts
          deploy/mealdeck/menu-structure.mjs tests/postgres/menu-structure-behavior.mjs
          --rule 'prettier/prettier: off'

      - name: Procurement and stock batch lint
        run: >
          bunx eslint src/components/ops/procurement-panel.tsx
          src/components/ops/stock-batches-panel.tsx
          src/lib/mealdeck-ops-procurement.ts
          src/lib/mealdeck-ops-procurement-types.ts
          tests/mealdeck-procurement.test.ts
          --rule 'prettier/prettier: off'

      - name: Supplier invoice operations lint
        run: >
          bunx eslint src/components/ops/supplier-invoices-panel.tsx
          src/lib/mealdeck-ops-invoices.ts
          src/lib/mealdeck-ops-invoice-types.ts
          tests/mealdeck-invoice-matching.test.ts
          --rule 'prettier/prettier: off'

      - name: Group payment, KDS and delivery fulfilment regression suite
        run: >-
          bun test tests/mealdeck-group-payment-gate.test.ts
          tests/mealdeck-group-invitations.test.ts
          tests/mealdeck-payment-event-ledger.test.ts
          tests/mealdeck-kds-outbox.test.ts
          tests/mealdeck-delivery-selection.test.ts
          tests/mealdeck-fulfilment-planner.test.ts
          tests/mealdeck-fulfilment-status.test.ts
          tests/mealdeck-handoff.test.ts

      - name: Host-pays group choices, packing and authentication return
        run: >-
          bun test tests/mealdeck-group-plan.test.ts
          tests/mealdeck-group-handoff.test.ts
          tests/mealdeck-customer-return.test.ts

      - name: Shared and phone payment evidence, recovery and staff permissions
        run: >-
          bun test tests/mealdeck-shared-payments.test.ts
          tests/mealdeck-shared-payments-server.test.ts
          tests/mealdeck-order-payments-server.test.ts
          tests/mealdeck-payments-access.test.ts

      - name: Install isolated PostgreSQL integration dependencies
        run: npm ci --prefix tests/postgres

      - name: Category and add-on authorization, conflicts and canonical checkout
        run: node tests/postgres/menu-structure-behavior.mjs

      - name: Safe anonymous menu read and private authority isolation
        run: node tests/postgres/public-menu-read-behavior.mjs

      - name: Included drinks follow current product stock at quote and payment preparation
        run: node tests/postgres/included-drink-stock-behavior.mjs

      - name: Special requests stay frozen through checkout, payment, kitchen and receipt
        run: node tests/postgres/order-notes-behavior.mjs

      - name: Additive milkcake publication and canonical dessert pricing
        run: node tests/postgres/milkcake-desserts-behavior.mjs

      - name: Sunday milkcake exact payment, timing and prepared-order recovery
        run: node tests/postgres/milkcake-offer-behavior.mjs

      - name: Private kerbside contact projection and staff scope
        run: node tests/postgres/kerbside-contact-behavior.mjs

      - name: Shared KDS and printer acceptance with one canonical receipt
        run: node tests/postgres/printer-acceptance-behavior.mjs

      - name: Completed receipt retirement preserves payment and print history
        run: node tests/postgres/receipt-archive-behavior.mjs

      - name: Staff cash collection, immutable tender and safe attempt closure
        run: node tests/postgres/staff-cash-orders-behavior.mjs

      - name: Frozen meal inclusions, replacements and cash receipt composition
        run: node tests/postgres/meal-components-behavior.mjs

      - name: Bounded live verification and public ordering isolation
        run: node tests/postgres/live-verification-behavior.mjs

      - name: Payment HTTP handlers against migrated PostgreSQL contracts
        run: bun test tests/mealdeck-payment-http-postgres.test.ts

      - name: Live ordering rooms, private invitations and named packing
        run: >-
          bun test tests/mealdeck-group-rooms.test.ts
          tests/mealdeck-group-room-ui-state.test.ts
          tests/mealdeck-packing-name.test.ts

      - name: Ordering room implementation and migration checks
        run: >-
          bunx eslint src/lib/mealdeck-group-rooms.ts
