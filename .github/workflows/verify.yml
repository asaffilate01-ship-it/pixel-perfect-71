name: Verify MealDeck
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Franchise offer and enquiry regressions
        run: bun test tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
      - name: MealDeck Play game regressions
        run: bun test tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts tests/hero-food-deck.test.ts
      - name: Marketplace discovery, saved basket and category regressions
        run: bun test tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts
      - run: bun run build
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Franchise implementation lint
        run: >
          bunx eslint src/routes/franchise.tsx src/routes/api.franchise.ts
          src/lib/franchise-offer.ts src/lib/franchise-api.ts
          src/lib/franchise-selection.ts src/lib/franchise-brands.ts
          src/components/franchise/*.tsx
          'src/routes/franchise_.$brandId.tsx'
          tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
          --rule 'prettier/prettier: off'

      - name: Game module lint
        run: >
          bunx eslint src/lib/dishbee-play.ts src/lib/kitchen-chaos.ts
          src/lib/mealdeck-collection-games.ts src/lib/game-brand-artwork.ts
          src/components/play/premium-games.tsx src/routes/play.tsx
          tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts
          --rule 'prettier/prettier: off'

      - name: Marketplace ordering lint
        run: >
          bunx eslint src/routes/order.tsx
          src/lib/marketplace-discovery.ts src/lib/marketplace-preferences.ts
          src/lib/marketplace-photos.ts src/components/order/premium-discovery.tsx
          tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts
          --rule 'prettier/prettier: off'
