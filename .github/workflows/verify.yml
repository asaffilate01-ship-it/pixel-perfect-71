name: Verify MealDeck
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Launch menu transcription, unpriced basket and cross-brand choices
        run: bun test tests/launch-menu-catalogue.test.ts tests/launch-menu-picks.test.ts tests/launch-menu-upsells.test.ts tests/launch-menu-navigation.test.ts
      - name: Launch menu and approved logo implementation lint
        run: >-
          bunx eslint src/lib/launch-menu-catalogue.ts src/lib/launch-menu-picks.ts
          src/lib/launch-menu-upsells.ts
          src/lib/brand-logos.ts src/components/mealdeck-logo.tsx
          src/components/menus/launch-menu-browser.tsx src/routes/menus.tsx
          src/components/menus/launch-basket.tsx src/components/menus/launch-item-customiser.tsx
          src/components/menus/launch-menu-mobile-nav.tsx src/lib/launch-menu-navigation.ts src/routes/menu.tsx
          tests/launch-menu-catalogue.test.ts tests/launch-menu-picks.test.ts
          tests/launch-menu-upsells.test.ts
          tests/launch-menu-navigation.test.ts
          --rule 'prettier/prettier: off'
      - name: Franchise offer and enquiry regressions
        run: bun test tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
      - name: MealDeck Play game regressions
        run: bun test tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts tests/arcade-games.test.ts tests/hero-food-deck.test.ts
      - name: Marketplace discovery, saved basket and category regressions
        run: bun test tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts tests/mealdeck-preview-basket.test.ts
      - name: Sample-deck arithmetic and accessibility implementation lint
        run: >-
          bunx eslint src/lib/mealdeck-preview-basket.ts
          tests/mealdeck-preview-basket.test.ts
          --rule 'prettier/prettier: off'
      - name: "WhatsApp assistant test: privacy, validation and multi-brand handoff"
        run: bun test tests/whatsapp-assistance.test.ts
      - name: MealDeck backend staff, costing, analytics and RLS source contracts
        run: bun test tests/mealdeck-ops.test.ts
      - name: Shared kitchen board, strict feed and full-order presentation
        run: bun test tests/mealdeck-kds*.test.ts
      - name: Supplier, purchase approval, stock batch and expiry regressions
        run: bun test tests/mealdeck-procurement.test.ts
      - name: Supplier invoice, VAT review and credit-note regressions
        run: bun test tests/mealdeck-invoice-matching.test.ts
      - run: bun run build
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Franchise implementation lint
        run: >
          bunx eslint src/routes/franchise.tsx src/routes/api.franchise.ts
          src/lib/franchise-offer.ts src/lib/franchise-api.ts
          src/lib/franchise-selection.ts src/lib/franchise-brands.ts
          src/components/franchise/*.tsx
          'src/routes/franchise_.$brandId.tsx'
          tests/franchise-offer.test.ts tests/franchise-api.test.ts tests/franchise-selection.test.ts
          --rule 'prettier/prettier: off'

      - name: Game module lint
        run: >
          bunx eslint src/lib/dishbee-play.ts src/lib/kitchen-chaos.ts
          src/lib/mealdeck-collection-games.ts src/lib/game-brand-artwork.ts src/lib/arcade-games.ts
          src/components/play/premium-games.tsx src/components/play/arcade-games.tsx src/routes/play.tsx
          tests/dishbee-play.test.ts tests/mealdeck-premium-games.test.ts tests/arcade-games.test.ts
          --rule 'prettier/prettier: off'

      - name: Marketplace ordering lint
        run: >
          bunx eslint src/routes/order.tsx
          src/lib/marketplace-discovery.ts src/lib/marketplace-preferences.ts
          src/lib/marketplace-photos.ts src/components/order/premium-discovery.tsx
          tests/marketplace-discovery.test.ts tests/marketplace-preferences.test.ts
          --rule 'prettier/prettier: off'

      - name: WhatsApp handoff and preview lint
        run: >
          bunx eslint src/lib/whatsapp-assistance.ts
          src/lib/whatsapp-assistance.functions.ts
          src/components/order/whatsapp-basket-handoff.tsx
          src/components/coming-soon.tsx
          tests/whatsapp-assistance.test.ts
          --rule 'prettier/prettier: off'

      - name: Staff console lint
        run: >
          bunx eslint src/routes/ops.tsx src/routes/kds.tsx
          src/components/ops/operations-workspace.tsx src/components/ops/kds-panel.tsx
          src/lib/mealdeck-kds.ts src/lib/mealdeck-kds-presentation.ts
          tests/mealdeck-kds*.test.ts
          src/components/ops/ops-panels.tsx
          src/components/ops/menu-kitchen-route.tsx
          src/lib/mealdeck-ops-browser.ts src/lib/mealdeck-ops-access.ts
          src/lib/mealdeck-ops-math.ts src/lib/mealdeck-ops-types.ts
          tests/mealdeck-ops.test.ts
          --rule 'prettier/prettier: off'

      - name: Procurement and stock batch lint
        run: >
          bunx eslint src/components/ops/procurement-panel.tsx
          src/components/ops/stock-batches-panel.tsx
          src/lib/mealdeck-ops-procurement.ts
          src/lib/mealdeck-ops-procurement-types.ts
          tests/mealdeck-procurement.test.ts
          --rule 'prettier/prettier: off'

      - name: Supplier invoice operations lint
        run: >
          bunx eslint src/components/ops/supplier-invoices-panel.tsx
          src/lib/mealdeck-ops-invoices.ts
          src/lib/mealdeck-ops-invoice-types.ts
          tests/mealdeck-invoice-matching.test.ts
          --rule 'prettier/prettier: off'

      - name: Group payment, KDS and delivery fulfilment regression suite
        run: >-
          bun test tests/mealdeck-group-payment-gate.test.ts
          tests/mealdeck-group-invitations.test.ts
          tests/mealdeck-payment-event-ledger.test.ts
          tests/mealdeck-kds-outbox.test.ts
          tests/mealdeck-delivery-selection.test.ts
          tests/mealdeck-fulfilment-planner.test.ts
          tests/mealdeck-fulfilment-status.test.ts
          tests/mealdeck-handoff.test.ts

      - name: Fulfilment module lint
        run: >-
          bunx eslint src/lib/mealdeck-fulfilment-planner.ts
          src/lib/mealdeck-fulfilment-status.ts src/lib/mealdeck-handoff.ts
          tests/mealdeck-fulfilment-planner.test.ts tests/mealdeck-fulfilment-status.test.ts
          tests/mealdeck-handoff.test.ts --rule 'prettier/prettier: off'

      - name: Checkout delivery charge integrity
        run: bun test tests/mealdeck-checkout-delivery-fee.test.ts

      - name: Checkout charge policy lint
        run: >-
          bunx eslint src/lib/mealdeck-checkout-delivery-fee.ts
          tests/mealdeck-checkout-delivery-fee.test.ts
          --rule 'prettier/prettier: off'

      - name: Trusted courier tracking link checks
        run: bun test tests/mealdeck-tracking-links.test.ts

      - name: Courier tracking link lint
        run: >-
          bunx eslint src/lib/mealdeck-tracking-links.ts
          tests/mealdeck-tracking-links.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 31 customer kitchen-pass-courier tracking truthfulness
        run: bun test tests/mealdeck-tracking-presentation.test.ts

      - name: Phase 31 tracking UI and privacy/claim boundary lint
        run: >-
          bunx eslint src/lib/mealdeck-tracking-presentation.ts
          src/components/order/tracking-timeline.tsx src/routes/track.tsx
          tests/mealdeck-tracking-presentation.test.ts
          --rule 'prettier/prettier: off'

      - name: "Phase 19–21: penny-accurate group splits, AI tool limits, order review"
        run: >-
          bun test tests/mealdeck-group-allocation.test.ts
          tests/mealdeck-agent-guardrails.test.ts
          tests/mealdeck-ops-alerts.test.ts

      - name: "Phase 19–21 source, tests and preview lint"
        run: >-
          bunx eslint src/lib/mealdeck-group-allocation.ts
          src/lib/mealdeck-agent-guardrails.ts
          src/lib/mealdeck-ops-alerts.ts
          tests/mealdeck-group-allocation.test.ts
          tests/mealdeck-agent-guardrails.test.ts
          tests/mealdeck-ops-alerts.test.ts
          src/components/coming-soon.tsx
          --rule 'prettier/prettier: off'

      - name: Dishbee canonical routing, checkout receipt and launch gate
        run: bun test tests/mealdeck-dishbee-contract.test.ts

      - name: Phase 32 checkout-attempt safety and replay tests
        run: bun test tests/mealdeck-checkout-attempt.test.ts

      - name: Phase 32 checkout attempt module lint
        run: >-
          bunx eslint src/lib/mealdeck-checkout-attempt.ts
          tests/mealdeck-checkout-attempt.test.ts
          --rule 'prettier/prettier: off'

      - name: Dishbee integration boundary lint
        run: >-
          bunx eslint src/lib/mealdeck-dishbee-contract.ts
          src/lib/dishbee.functions.ts
          tests/mealdeck-dishbee-contract.test.ts
          --rule 'prettier/prettier: off'

      - name: Synthetic paid-to-KDS integration rehearsal
        run: bun test tests/mealdeck-runtime-acceptance.test.ts

      - name: Synthetic payment and fulfilment test lint
        run: >-
          bunx eslint tests/mealdeck-runtime-acceptance.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 27 Dishbee server-priced basket and fee estimate
        run: bun test tests/mealdeck-live-price-estimate.test.ts

      - name: Phase 27 quote module lint
        run: >-
          bunx eslint src/lib/mealdeck-live-price-estimate.ts
          tests/mealdeck-live-price-estimate.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 28-30 signed quote, current repricing and expiry tests
        run: bun test tests/mealdeck-quote.test.ts

      - name: Phase 28-30 quote module lint
        run: >-
          bunx eslint src/server/mealdeck-quote.ts
          tests/mealdeck-quote.test.ts
          --rule 'prettier/prettier: off'

      - name: Single-delivery courier booking guard regression
        run: bun test tests/mealdeck-courier-booking-guard.test.ts

      - name: Courier booking guard lint
        run: >-
          bunx eslint src/lib/mealdeck-courier-booking-guard.ts
          tests/mealdeck-courier-booking-guard.test.ts
          --rule 'prettier/prettier: off'

      - name: Courier booking recovery and idempotency tests
        run: bun test tests/mealdeck-courier-booking-recovery.test.ts

      - name: Courier recovery module lint
        run: >-
          bunx eslint src/lib/mealdeck-courier-booking-recovery.ts
          tests/mealdeck-courier-booking-recovery.test.ts
          --rule 'prettier/prettier: off'

      - name: Independent MealDeck connection and staff session lifecycle
        run: bun test tests/mealdeck-runtime-config.test.ts tests/mealdeck-backend-client-cache.test.ts

      - name: Independent backend configuration lint
        run: >-
          bunx eslint src/lib/mealdeck-runtime-config.ts
          src/lib/mealdeck-backend.functions.ts src/lib/mealdeck-backend-client-cache.ts
          src/lib/business-identity.ts
          tests/mealdeck-runtime-config.test.ts
          tests/mealdeck-backend-client-cache.test.ts
          --rule 'prettier/prettier: off'

      - name: Checkout postcode request race regression
        run: bun test tests/mealdeck-serviceability-generation.test.ts

      - name: Postcode serviceability request lint
        run: >-
          bunx eslint src/lib/mealdeck-serviceability-generation.ts
          tests/mealdeck-serviceability-generation.test.ts
          --rule 'prettier/prettier: off'

      - name: Franchise FAQ retrieval and scope regression
        run: bun test tests/mealdeck-franchise-faq-search.test.ts

      - name: Franchise FAQ search module lint
        run: >-
          bunx eslint src/lib/mealdeck-franchise-faq-search.ts
          tests/mealdeck-franchise-faq-search.test.ts
          --rule 'prettier/prettier: off'

      - name: Homepage preview offer discovery
        run: bun test tests/mealdeck-preview-offers.test.ts

      - name: Homepage offer preview lint
        run: >-
          bunx eslint src/lib/mealdeck-preview-offers.ts
          src/components/marketing/offer-discovery-preview.tsx
          tests/mealdeck-preview-offers.test.ts
          --rule 'prettier/prettier: off'

      - name: Luton and St Albans weekly paid-order goal regressions
        run: bun test tests/mealdeck-weekly-paid-goal.test.ts

      - name: Weekly paid-order goal source and UI lint
        run: >-
          bunx eslint src/lib/mealdeck-weekly-paid-goal.ts
          src/components/ops/paid-orders-goal-panel.tsx
          tests/mealdeck-weekly-paid-goal.test.ts
          --rule 'prettier/prettier: off'

      - name: Design audit navigation states
        run: bun test tests/mealdeck-nav-state.test.ts

      - name: Navigation design module lint
        run: >-
          bunx eslint src/lib/mealdeck-nav-state.ts
          src/components/site-header.tsx
          tests/mealdeck-nav-state.test.ts
          --rule 'prettier/prettier: off'

      - name: Keyboard skip navigation and mobile bar
        run: bun test tests/mealdeck-skip-navigation.test.tsx

      - name: Main navigation accessibility lint
        run: >-
          bunx eslint src/components/skip-to-main-content.tsx
          src/components/mobile-tab-bar.tsx
          tests/mealdeck-skip-navigation.test.tsx
          --rule 'prettier/prettier: off'

      - name: Mobile discovery basket shortcut regression
        run: bun test tests/mealdeck-mobile-sample-basket-bar.test.ts

      - name: Mobile preview basket source lint
        run: >-
          bunx eslint src/lib/mealdeck-sample-basket-bar.ts
          src/components/order/mobile-sample-basket-bar.tsx
          tests/mealdeck-mobile-sample-basket-bar.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 40 safe sample basket editing tests
        run: bun test tests/mealdeck-sample-basket-edit.test.ts

      - name: Phase 40 sample basket edit module lint
        run: >-
          bunx eslint src/lib/mealdeck-sample-basket-edit.ts
          tests/mealdeck-sample-basket-edit.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 41 sample dish modifiers regressions
        run: bun test tests/mealdeck-sample-modifiers.test.ts

      - name: Phase 41 modifiers and preview basket lint
        run: >-
          bunx eslint src/lib/mealdeck-sample-modifiers.ts
          src/lib/mealdeck-preview-basket.ts
          tests/mealdeck-sample-modifiers.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 42 distinct customised sample dish variants
        run: bun test tests/mealdeck-sample-variants.test.ts

      - name: Phase 42 basket variant source lint
        run: >-
          bunx eslint src/lib/mealdeck-sample-variants.ts
          src/lib/mealdeck-preview-basket.ts
          tests/mealdeck-sample-variants.test.ts
          --rule 'prettier/prettier: off'

      - name: Phase 43 allergen and dietary preview regressions
        run: bun test tests/mealdeck-preview-allergens.test.ts

      - name: Phase 43 allergen guidance lint
        run: >-
          bunx eslint src/lib/mealdeck-preview-allergens.ts
          tests/mealdeck-preview-allergens.test.ts
          --rule 'prettier/prettier: off'

  kds-postgres17:
    name: Kitchen PostgreSQL 17 permissions and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mealdeck_disposable_ci_only
          POSTGRES_DB: mealdeck_kds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealdeck_kds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated PostgreSQL test dependencies
        run: npm ci --prefix tests/postgres
      - name: Execute actual SQL permissions, whole-order transitions and two-session races
        env:
          MEALDECK_KDS_TEST_DATABASE_URL: postgresql://postgres:mealdeck_disposable_ci_only@127.0.0.1:5432/mealdeck_kds_test
        run: npm run test:postgres --prefix tests/postgres

  standalone-postgres17:
    name: Independent MealDeck PostgreSQL 17 installation and admin security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mealdeck_disposable_ci_only
          POSTGRES_DB: mealdeck_kds_test_standalone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealdeck_kds_test_standalone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated PostgreSQL test dependencies
        run: npm ci --prefix tests/postgres
      - name: Execute the complete independent production profile and authorized admin workflows
        env:
          MEALDECK_KDS_TEST_DATABASE_URL: postgresql://postgres:mealdeck_disposable_ci_only@127.0.0.1:5432/mealdeck_kds_test_standalone
        run: npm run test:standalone:postgres --prefix tests/postgres
