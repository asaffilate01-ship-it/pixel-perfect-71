name: Publish MealDeck Printer v0.2.2 Direct

on:
  push:
    branches:
      - "release/printer-v0.2.2-direct-20261107"
    paths:
      - ".github/workflows/publish-printer-v022-direct.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mealdeck-printer/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install printer dependencies
        working-directory: apps/mealdeck-printer
        run: |
          npm ci --ignore-scripts
          npm run sync:android

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release
        working-directory: apps/mealdeck-printer/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Generate permanent MealDeck signing identity
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 24)"
          printf '%s' "$STORE_PASS" > "$RUNNER_TEMP/mealdeck-printer-storepass.txt"
          chmod 600 "$RUNNER_TEMP/mealdeck-printer-storepass.txt"
          keytool -genkeypair             -keystore "$RUNNER_TEMP/mealdeck-printer-release.p12"             -storetype PKCS12             -storepass "$STORE_PASS"             -keypass "$STORE_PASS"             -alias mealdeck-printer-release             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=MealDeck Printer, OU=Operations, O=313 Brands Ltd, L=Luton, ST=England, C=GB"

      - name: Sign, verify and stage v0.2.2
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="apps/mealdeck-printer/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/mealdeck-printer-h10s-0.2.2-aligned.apk"
          OUTPUT="public/downloads/mealdeck-printer-h10s-0.2.2.apk"
          mkdir -p public/downloads
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/mealdeck-printer-release.p12"             --ks-key-alias mealdeck-printer-release             --ks-pass "file:$RUNNER_TEMP/mealdeck-printer-storepass.txt"             --key-pass "file:$RUNNER_TEMP/mealdeck-printer-storepass.txt"             --out "$OUTPUT"             "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT" | tee "$RUNNER_TEMP/signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT" | tee "$RUNNER_TEMP/package.txt"
          grep -q "package: name='uk.co.mealdeck.printer' versionCode='4' versionName='0.2.2'" "$RUNNER_TEMP/package.txt"
          sha256sum "$OUTPUT" | tee "public/downloads/mealdeck-printer-h10s-0.2.2.apk.sha256"

      - name: Encrypt signing backup
        shell: bash
        env:
          RECOVERY_CERT_B64: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-backup"
          cp "$RUNNER_TEMP/mealdeck-printer-release.p12" "$RUNNER_TEMP/signing-backup/"
          cp "$RUNNER_TEMP/mealdeck-printer-storepass.txt" "$RUNNER_TEMP/signing-backup/store-password.txt"
          cp "$RUNNER_TEMP/signature.txt" "$RUNNER_TEMP/signing-backup/signature.txt"
          tar -C "$RUNNER_TEMP/signing-backup" -czf "$RUNNER_TEMP/mealdeck-printer-signing-backup.tar.gz" .
          printf '%s' "$RECOVERY_CERT_B64" | base64 -d > "$RUNNER_TEMP/recovery-cert.pem"
          openssl cms -encrypt -binary -aes256             -in "$RUNNER_TEMP/mealdeck-printer-signing-backup.tar.gz"             -out "$RUNNER_TEMP/mealdeck-printer-signing-backup.cms"             -outform DER             "$RUNNER_TEMP/recovery-cert.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: mealdeck-printer-v0.2.2-signing-backup-encrypted
          path: ${{ runner.temp }}/mealdeck-printer-signing-backup.cms
          retention-days: 30
          if-no-files-found: error

      - name: Commit signed APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MealDeck Release Bot"
          git config user.email "release-bot@mealdeck.co.uk"
          git add public/downloads/mealdeck-printer-h10s-0.2.2.apk public/downloads/mealdeck-printer-h10s-0.2.2.apk.sha256
          git commit -m "Publish signed MealDeck Printer v0.2.2 [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
