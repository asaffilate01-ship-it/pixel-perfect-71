name: Publish tested KDS source
on:
  push:
    branches: [feature/mealdeck-kds-six-stages-20261106]
    paths: [.github/workflows/kds-publish-tested.yml]
permissions:
  contents: write
concurrency:
  group: mealdeck-kds-publish-tested
  cancel-in-progress: false
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mealdeck-kds-six-stages-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact locally tested source patch
        shell: python
        run: |
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = '''eNrtfdlyG9mS2Du/4jSuYgCIBRDgogVc1Gq1+k671d0aUdcTMTINFgoFopqFKnRVgRSbQoSf/AF+8R/4F/xu/8l8iXM5ay0gpNa1HROjUIBA1Vkz8+R28uSZRrOZ6PWuokL4e3kW7MXRZG8R+vE0DK5719O8t8zCPEwKv4jSpF/kYrJVsZ1er7dlizu7u7vbtvrtt6J35D0Vu0fe8Eh8++2OEKK4W4bip2n+azYNM29HrMUsSxei1XWwVMVasssQil97mvhSJdXVN9eQYkbi3JJ''' 
