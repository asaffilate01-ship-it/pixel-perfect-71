<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="noindex" />
    <title>Reconnect to MealDeck</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px 20px max(28px, env(safe-area-inset-bottom));
        background: #fff6e8;
        color: #111;
        font-family: system-ui, sans-serif;
        border-top: 7px solid #d5141d;
      }
      main {
        width: min(100%, 440px);
        text-align: center;
      }
      img {
        width: 140px;
        height: 140px;
        object-fit: contain;
      }
      small {
        display: block;
        margin: 16px 0;
        color: #951018;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      h1 {
        font-size: clamp(32px, 7vw, 42px);
        line-height: 1.08;
        letter-spacing: -0.04em;
        margin: 16px 0;
      }
      p {
        font-size: 15px;
        line-height: 1.65;
        color: #655a4e;
      }
      a {
        display: flex;
        min-height: 52px;
        justify-content: center;
        align-items: center;
        margin-top: 24px;
        padding: 14px 20px;
        border-radius: 13px;
        background: #d5141d;
        color: white;
        text-decoration: none;
        font-weight: 750;
      }
      a:focus-visible {
        outline: 3px solid #951018;
        outline-offset: 5px;
      }
      .note {
        padding: 17px;
        border: 1px solid #e4d8c7;
        border-radius: 13px;
        background: #fffdf7;
        font-size: 13px;
      }
      .credit {
        margin-top: 32px;
        font-size: 12px;
        color: #75695d;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/mealdeck-icon-192.png" alt="MealDeck" width="140" height="140" />
      <small>A quick pause</small>
      <h1>Let’s get you<br />connected again.</h1>
      <p>MealDeck needs a connection to load the latest menus and order updates.</p>
      <p class="note">
        Your saved basket stays on this device. Reconnect to continue. This screen does not confirm
        an order or payment.
      </p>
      <a href="/menus">Try the menus again</a>
      <p class="credit">One order. Every craving.<br />Powered by Dishbee</p>
    </main>
  </body>
</html>
